status = warn
name = PropertiesConfig
appenders = console, file

# Console Appender (for User Interface)
appender.console.type = Console
appender.console.name = ConsoleAppender
# Only print INFO and higher (User Interface prompts, results, user errors)
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = info
# Print only the raw message, formatted clean
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %msg%n

# File Appender Configuration (for Developer Auditing)
appender.file.type = File
appender.file.name = FileAppender
appender.file.fileName = logs/calculator.log
appender.file.append = true
# Record everything from DEBUG level and above
appender.file.filter.threshold.type = ThresholdFilter
appender.file.filter.threshold.level = debug
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%t] %-5level %logger{36} - %msg%n

# Root Logger Configuration
rootLogger.level = debug
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = ConsoleAppender
rootLogger.appenderRef.file.ref = FileAppender
